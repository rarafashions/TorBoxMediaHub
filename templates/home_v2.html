<!DOCTYPE html>
<html lang="id" data-theme="netflix">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>TorBox Media Hub {{ app_version }}</title>

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

  <!-- Design system v2: CSS/JS lokal, tanpa CDN, tetap berjalan offline.
       Cache-busting memakai versi aplikasi agar aset baru langsung dipakai. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='ui/tokens.css') }}?v={{ app_version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ui/components.css') }}?v={{ app_version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ui/app.css') }}?v={{ app_version }}">
</head>

<body class="v2 v2-app">

  <!-- ============================ TOP NAV ============================ -->
  <nav class="topnav topnav--app" aria-label="Navigasi utama">
    <a class="topnav__brand" href="#/home">
      <img class="topnav__logo" src="{{ url_for('static', filename='logo.png') }}" alt="">
      <span>TorBox <span style="color:var(--accent)">Hub</span></span>
    </a>

    <div class="topnav__nav" role="tablist" aria-label="Bagian aplikasi">
      <button type="button" class="topnav__link" role="tab" data-view="home">Beranda</button>
      <button type="button" class="topnav__link" role="tab" data-view="discover">Discovery</button>
      <button type="button" class="topnav__link" role="tab" data-view="library">Library</button>
      <button type="button" class="topnav__link" role="tab" data-view="series">Serial</button>
      <button type="button" class="topnav__link" role="tab" data-view="playlists">Playlist</button>
      <button type="button" class="topnav__link" role="tab" data-view="downloads">Unduhan</button>
      <button type="button" class="topnav__link" role="tab" data-view="stats">Statistik</button>
      <button type="button" class="topnav__link" role="tab" data-view="settings">Pengaturan</button>
    </div>

    <label class="topnav__search" for="v2-search">
      <svg class="btn__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path>
      </svg>
      <input id="v2-search" type="search" placeholder="Cari judul, kode, genre..." autocomplete="off"
             aria-label="Cari katalog">
    </label>

    <span class="topnav__badge" id="v2-version">{{ app_version }}</span>
  </nav>

  <!-- ============================ CONTENT =========================== -->
  <main id="v2-main" role="main">
    <!-- Skeleton awal; diganti oleh render() di home.js -->
    <div class="billboard">
      <div class="billboard__scrim"></div>
    </div>
  </main>

  <footer class="footer">
    <span>TorBox Media Hub {{ app_version }}</span>
    <span>Library · Serial · Playlist · Unduhan · Statistik · Pengaturan</span>
    <a href="/legacy" style="color:var(--text-2)">UI lama</a>
    <a href="/legacy?discover=1" style="color:var(--text-2)">Discovery</a>
    <a href="/roxxy" style="color:var(--text-2)">Video Feeds</a>
  </footer>

  <script src="{{ url_for('static', filename='ui/home.js') }}?v={{ app_version }}"></script>
</body>
</html>
