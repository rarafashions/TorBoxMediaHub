<!DOCTYPE html>
<html lang="id" data-theme="netflix">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>TorBox Media Hub {{ app_version }}</title>

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Design system v2: tanpa Tailwind, tanpa CDN, tetap jalan offline -->
  <link rel="stylesheet" href="{{ url_for('static', filename='ui/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ui/components.css') }}">
</head>

<body class="v2">

  <!-- ============================ TOP NAV ============================ -->
  <nav class="topnav" aria-label="Navigasi utama">
    <a class="topnav__brand" href="/v2">
      <img class="topnav__logo" src="{{ url_for('static', filename='logo.png') }}" alt="">
      <span>TorBox <span style="color:var(--accent)">Hub</span></span>
    </a>

    <div class="topnav__links">
      <a class="topnav__link is-active" href="/v2" data-keep>Beranda</a>
      <a class="topnav__link" href="/" data-keep>Library</a>
      <a class="topnav__link" href="/?discover=1" data-keep>Discovery</a>
      <a class="topnav__link" href="/roxxy" data-keep>Video Feeds</a>
    </div>

    <label class="topnav__search" for="v2-search">
      <svg class="btn__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path>
      </svg>
      <input id="v2-search" type="search" placeholder="Cari judul, kode, genre..." autocomplete="off"
             aria-label="Cari katalog">
    </label>

    <span class="topnav__badge">{{ app_version }}</span>
  </nav>

  <!-- ============================ CONTENT =========================== -->
  <main id="v2-main" role="main">
    <!-- Skeleton awal; diganti oleh render() di home.js -->
    <div class="billboard">
      <div class="billboard__scrim"></div>
    </div>
  </main>

  <footer class="footer">
    <span>TorBox Media Hub {{ app_version }}</span>
    <span>Discovery · Video Feeds · TorBox · Download · Library</span>
    <a href="/" style="color:var(--text-2)">Beralih ke UI lama</a>
  </footer>

  <script src="{{ url_for('static', filename='ui/home.js') }}"></script>
</body>
</html>
